[main]
dns=default
plugins=keyfile
autoconnect-retries-default=0
rc-manager=file

[keyfile]
unmanaged-devices=type:bridge;type:tun;driver:veth

[logging]
backend=journal

[connection]
connection.mdns=2
connection.llmnr=2
wifi.powersave=2

[connectivity]
# Plain HTTP only: NetworkManager itself warns that HTTPS connectivity checks
# are unreliable, and on the lab RPi4 the HTTPS check against chezbob always
# reported "portal" (Connectivity=2) even though the URL returned 200, which
# made the Supervisor block internet-needing jobs (e.g. AppManager.install)
# with "no host internet connection". Validated live: with the upstream HTTP
# probe below, Connectivity reports 4 (full) and add-on installs proceed.
uri=http://checkonline.home-assistant.io/online.txt
interval=600

[device]
wifi.scan-rand-mac-address=no
