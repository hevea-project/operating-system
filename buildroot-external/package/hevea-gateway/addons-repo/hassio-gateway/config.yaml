name: Hevea Gateway
description: 'Hevea Gateway: device commissioning, onboarding portal and user database
  sync'
version: latest
slug: hassio-gateway
init: false
arch:
- aarch64
- amd64
hassio_api: true
hassio_role: admin
host_dbus: true
host_network: true
# GPIO access for the commissioning button (GPIO 17) and the RGB LED
# (pkg/gateway/gpio.go): the Supervisor maps these devices into the container.
devices:
- /dev/gpiochip0
- /dev/gpiochip1
- /dev/gpiomem
map:
- homeassistant_config:rw
webui: http://[HOST]:[PORT:7040]
options:
  access_point: true
  api_addr: 0.0.0.0:7040
  app_addr: https://app.hevea-project.io
  homeassistant_addr: http://127.0.0.1:80
  app_name: ''
  log_level: info
  openvpn_app_name: ''
  ap_app_name: ''
  ap_ssid: ''
  portal_port: 9000
  portal_band: 2.4
  supervisor_driver: supervisor
  sync_enabled: false
  sync_interval: 300
  sync_db_path: /data/db
  commission_extract_path: /data/commissions
  networks:
  - ssid: Hevea Access Point
    password: abcd1234
    id: '1234567890'
schema:
  access_point: bool
  api_addr: str
  app_addr: str
  homeassistant_addr: str
  app_name: str
  log_level: str
  openvpn_app_name: str
  ap_app_name: str
  ap_ssid: str
  portal_port: int
  portal_band: float
  supervisor_driver: str
  sync_enabled: bool
  sync_interval: int
  sync_db_path: str
  commission_extract_path: str
  networks:
  - ssid: str
    password: password
    id: str
image: ghcr.io/hevea-project/gateway
url: https://github.com/hevea-project/hassio-apps/tree/master/hassio-gateway
