# Labgrid strategy for a physical Raspberry Pi 4 running HAOS.
#
# Prerequisites:
#   - Flash the HAOS RPi4 image to an SD card manually
#   - Boot the RPi and ensure it has a fixed IP (configure your DHCP)
#   - Set the RPI_IP environment variable or edit the address below
#   - The test SSH key must be in the RPi's authorized_keys
#     (inject via usb.img like for QEMU, or add manually)
#
# Usage:
#   RPI_IP=192.168.1.100 pytest --lg-env tests/hevea-rpi-strategy.yaml tests/hevea_test/

imports:
  - qemu_shell_strategy.py
  - hevea_rpi_strategy.py

targets:
  rpi4:
    resources:
      - NetworkService:
          address: ${RPI_IP}
          username: root

    drivers:
      - SSHDriver:
          key: ./tests/hevea_test/test_ssh_key
          connection_timeout: 60
      - CustomTimeoutShellDriver:
          command_timeout: 300
      - RPiShellStrategy: {}
