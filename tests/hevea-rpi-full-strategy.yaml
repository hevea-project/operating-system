# Full automation strategy for a physical Raspberry Pi 4B:
# - flash the HAOS image via USB OTG (rpiboot, no SD manipulation)
# - power on/off via a Home Assistant switch (Matter plug)
# - SSH into the booted RPi and run tests
#
# Prerequisites on the host:
#   sudo apt install usbboot   # or build from github.com/raspberrypi/usbboot
#   RPi4 connected to host via USB-C (power + data), NO SD card inserted
#
# Environment variables:
#   HA_URL       Home Assistant URL (default http://localhost:8123)
#   HA_TOKEN     Long-lived access token from HA
#   RPI_SWITCH   HA switch entity for the RPi power (default switch.rpi4)
#   RPI_IP       IP of the RPi once booted (DHCP, fixed via your router)

imports:
  - qemu_shell_strategy.py
  - hevea_rpi_power_driver.py
  - hevea_rpi_flash_strategy.py

targets:
  rpi4:
    resources:
      - NetworkService:
          address: ${RPI_IP}
          username: root

    drivers:
      - HomeAssistantPowerDriver:
          ha_url: ${HA_URL:-http://localhost:8123}
          ha_token: ${HA_TOKEN}
          entity: ${RPI_SWITCH:-switch.rpi4}
      - SSHDriver:
          key: ./hevea_test/test_ssh_key
          connection_timeout: 60
      - CustomTimeoutShellDriver:
          command_timeout: 300
      - RPiFlashStrategy:
          image_path: ../output_rpi4/images/haos_rpi4-18.4.img
