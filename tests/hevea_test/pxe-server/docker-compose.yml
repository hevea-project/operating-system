# PXE boot server for RPi4 testing: DHCP + TFTP (dnsmasq) + HTTP (nginx).
#
# Usage:
#   1. Extract boot files from the HAOS RPi4 image:
#        sudo ./extract-boot-files.sh ../../../output_rpi4/images/haos_rpi4-18.4.img
#   2. Start the server:
#        docker compose down && docker compose up -d
#   3. Boot the RPi4 (no SD) — it will PXE boot from this server.
#
# Only dnsmasq uses network_mode: host (DHCP/TFTP broadcasts must reach the
# RPi4). nginx is on the bridge with host port 8880 (host port 80 is usually
# already taken, e.g. by the QEMU HAOS VM hostfwd).

services:
  dnsmasq:
    image: andyshinn/dnsmasq:latest
    network_mode: host
    # run as root: the image otherwise drops to a non-root user that cannot
    # read a 0600 dnsmasq.conf owned by your user ("Permission denied")
    user: "0:0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      # :z = SELinux relabel (Fedora enforcing) — without it dnsmasq gets
      # "cannot read /etc/dnsmasq.conf: Permission denied"
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro,z
      - ./tftp:/tftpboot:ro,z
    command: --no-daemon --log-queries --conf-file=/etc/dnsmasq.conf
    restart: unless-stopped

  # HTTP server for the erofs rootfs (future diskless initramfs).
  # NOT network_mode: host — port 80 is already used on the host (e.g. the
  # QEMU HAOS VM hostfwd). Bridge + published port 8880 instead.
  # The RPi would fetch: http://<server-ip>:8880/hassos-system0.erofs
  http:
    image: nginx:alpine
    ports:
      - "8880:80"
    volumes:
      - ./http:/usr/share/nginx/html:ro,z
    restart: unless-stopped
