# PXE boot server for RPi4 testing: DHCP + TFTP + HTTP in Docker.
#
# Usage:
#   1. Extract boot files from the HAOS RPi4 image:
#        sudo ./extract-boot-files.sh ../../../output_rpi4/images/haos_rpi4-18.4.img
#   2. Start the server:
#        docker compose up -d
#   3. Boot the RPi4 (no SD) — it will PXE boot from this server.
#
# Requires network_mode: host so DHCP/TFTP broadcasts reach the RPi4.

services:
  dnsmasq:
    image: andyshinn/dnsmasq:latest
    network_mode: host
    # run as root: the image otherwise drops to a non-root user that cannot
    # read a 0600 dnsmasq.conf owned by your user ("Permission denied")
    user: "0:0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      # :z = SELinux relabel (Fedora enforcing) — without it dnsmasq gets
      # "cannot read /etc/dnsmasq.conf: Permission denied"
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro,z
      - ./tftp:/tftpboot:ro,z
    command: --no-daemon --log-queries --conf-file=/etc/dnsmasq.conf
    restart: unless-stopped

  http:
    image: nginx:alpine
    network_mode: host
    volumes:
      - ./http:/usr/share/nginx/html:ro,z
    restart: unless-stopped
