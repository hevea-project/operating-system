# dnsmasq for RPi4 PXE boot — PC wired to the router LAN (enp2s0f0,
# 192.168.1.101/24), same L2 segment as the RPi (wired to the router).
# The Pi4 netboots only over its wired port; the PC must be on the same
# wired segment for DHCP broadcasts to flow both ways (WiFi->eth is not
# forwarded by the router).
#
# Docker, network_mode: host. Mount with :z (SELinux), user "0:0".

# Disable DNS: port 53 is taken by systemd-resolved in the host netns.
port=0

# NOTE: `interface=` and `dhcp-option=66` (TFTP server IP) are NOT set here —
# they depend on the PC's wired interface name/IP which can change (USB
# dongle). The container entrypoint (entrypoint.sh) detects the IP of
# $PXE_IFACE (default enp6s0*) and passes them on the command line.

# Full DHCP on the LAN; reserve .150 for the RPi (LG_RPI_IP=192.168.1.150).
# The router does not answer PXEClient requests, so no conflict in practice.
dhcp-range=192.168.1.150,192.168.1.200,255.255.255.0,12h
dhcp-host=dc:a6:32:14:63:44,192.168.1.150
dhcp-option=3,192.168.1.1
dhcp-option=6,192.168.1.1
dhcp-authoritative
# Force broadcast replies: the Pi ROM may not receive unicast offers.
dhcp-broadcast

# Bootfile fetched over TFTP; the ROM then loads config.txt/cmdline.txt/dtbs
# by name from the TFTP root.
# Pi4 netboot ignores option 67 (bootfile); it gets the TFTP server from
# DHCP option 66 (tftp-server-name) — passed on the command line by
# entrypoint.sh with the detected IP of $PXE_IFACE.

# Headless debug: watch `docker logs -f pxe-server-dnsmasq-1`
log-dhcp

# --- TFTP ---
enable-tftp
tftp-root=/tftpboot
