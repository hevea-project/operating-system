# dnsmasq config for RPi4 PXE boot (Docker, network_mode: host).
# Adapt INTERFACE and the DHCP range to your LAN (see `ip addr`).

# We only need DHCP + TFTP, not DNS. Disable the DNS port: with
# network_mode: host it would clash with systemd-resolved (127.0.0.53:53)
# -> "failed to create listening socket for port 53: Address in use".
port=0

# --- DHCP ---
# Use your real LAN interface (wlp3s0 = WiFi, enp2s0f0/eth0 = wired).
interface=wlp3s0
# Range must be in the interface subnet and must NOT include the router
# (.1) or this PC's own IP (here 192.168.1.100).
dhcp-range=192.168.1.150,192.168.1.200,255.255.255.0,12h
dhcp-option=3,192.168.1.1          # default gateway
dhcp-option=6,192.168.1.1          # DNS
dhcp-authoritative
# Fixed IP for the RPi4 (MAC dc:a6:32:14:63:44) -> export LG_RPI_IP=192.168.1.150
dhcp-host=dc:a6:32:14:63:44,192.168.1.150
# Headless debug: watch `docker logs -f <dnsmasq container>` for the RPi
# DHCPDISCOVER and TFTP requests.
log-dhcp

# --- TFTP ---
enable-tftp
tftp-root=/tftpboot

# --- PXE boot for RPi4 ---
# Single field = bootfile fetched over TFTP; the firmware then loads
# config.txt, cmdline.txt and the *.dtb files by name from the TFTP root.
# (The 2nd field of dhcp-boot is the server NAME, not a second file.)
dhcp-boot=kernel8.img

# The Pi4 ROM identifies as vendor-class "PXEClient:Arch:00000:UNDI:002001"
# (DHCP option 60) and client-arch 0 (option 93). To tag the RPi by vendor
# class or MAC prefix (b8:27:eb / dc:a6:32 / d8:3a:dd / e4:5f:01):
# dhcp-match=set:rpi4,option:vendor-class,"PXEClient:Arch:00000:UNDI:002001"
# dhcp-boot=tag:rpi4,kernel8.img
#
# NOTE: if your router also runs a DHCP server, it may answer the RPi
# first with an offer that has NO bootfile. The Pi ROM keeps sending
# DHCPDISCOVER until it gets an offer with a bootfile, but to be safe,
# either disable DHCP on the router during tests or exclude
# 192.168.1.150-200 from its pool.
