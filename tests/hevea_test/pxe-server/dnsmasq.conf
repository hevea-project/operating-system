# dnsmasq config for RPi4 PXE boot.
# Edit SERVER_IP to your PC's LAN IP.

# --- DHCP ---
# Serve IPs in your LAN range; the RPi4 will get one (reserve it via MAC).
interface=eth0
dhcp-range=192.168.1.100,192.168.1.200,255.255.255.0,12h
dhcp-option=3,192.168.1.1          # default gateway
dhcp-option=6,192.168.1.1          # DNS

# --- TFTP ---
enable-tftp
tftp-root=/tftpboot

# --- PXE boot for RPi4 ---
# RPi4 boot ROM requests files by name over TFTP.
# Direct kernel boot (no pxelinux needed):
dhcp-boot=kernel8.img,cmdline.txt
# If using a bootcode.bin stage:
# dhcp-boot=bootcode.bin
# dhcp-boot=kernel8.img,cmdline.txt

# Tag RPi4 by vendor class or MAC for specific options:
# dhcp-match=set:rpi4,option:client-arch,00007
# dhcp-boot=tag:rpi4,kernel8.img,cmdline.txt
