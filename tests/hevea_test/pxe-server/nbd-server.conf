# nbd-server config for the diskless RPi4 boot: exports the whole HAOS disk
# image as a block device (read-write, so RAUC A/B updates work and are
# written back into nbd/hevea_rpi4.img on the PC).
#
# nbd-server (unlike qemu-nbd) forks a child per connection, so stale
# connections left behind by RPi power-cycles do not block new clients.
[generic]
port=10809

[haos]
exportname=/export/hevea_rpi4.img
readonly=false
flush=true
fua=true
